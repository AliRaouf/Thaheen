name: thaheen
description: "Thaheen mini offline LMS (Flutter screening task)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  easy_localization: ^3.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  go_router: ^18.0.1
  shared_preferences: ^2.5.5
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/translations/
    - assets/videos/
  fonts:
    - family: Sahel
      fonts:
        - asset: assets/fonts/sahel/Sahel-Light.ttf
          weight: 300
        - asset: assets/fonts/sahel/Sahel.ttf
        - asset: assets/fonts/sahel/Sahel-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/sahel/Sahel-Bold.ttf
          weight: 700
        - asset: assets/fonts/sahel/Sahel-Black.ttf
          weight: 900
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Thin.ttf
          weight: 100
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
